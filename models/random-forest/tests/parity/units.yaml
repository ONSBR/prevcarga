# Unidades de paridade do plugin random-forest (RF.4): clean-room x oraculo, Delta = 0 (limiar 1e-5 MW absoluto).
# Contrato do plugin_golden.R (P.0f) / plugin_parity.R (P.0g). Cortes POR FASE literais: treino em O-10 (= O-1-H, H = 9) com
# history_start O-375; infer em O e em O-1 com o MESMO artefato e o MESMO history_start absoluto O-45; available_until em hora
# cheia; clima emitido a meia-noite UTC do dia da origem. Sem oracle_cut (o RF do oraculo ignora --available-until,
# run_pipeline.R:238-241) e sem oracle_env. day0_source oracle_origin_minus_1: o dia O da entrega e o d_plus 1 de long_Om1.
# `rules` e conferido em toda unidade por pc_golden_units (violacao => tools.bad_units, exit 2).
packages: [randomForest, data.table, lubridate, arrow]
rules:
  train_origin_offset: 10
  train_history_offset: 375
  infer_history_offset: 45
  forbid: [oracle_cut]
  day0_source: [oracle_origin_minus_1]
  full_hour: true
  oracle_env_empty: true
  data_areas_is_area: true
  equals: { seed: 123, params: { ntree: 100 } }
groups:
  smoke: [seco-2024-10-01, rs-2024-07-01, baoe-2024-01-01]
  foundation:
    - seco-2024-01-01
    - seco-2024-07-01
    - seco-2024-10-01
