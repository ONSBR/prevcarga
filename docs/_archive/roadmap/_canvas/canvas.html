<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>prevcarga — topologia por milestone</title>
<meta name="description" content="Topologia interna do pacote R prevcarga (verbos → pipeline → transversais → config) com o delta de cada milestone em destaque.">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#6f6e69; --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --edge-faint:#c3c2b7; --edge-op:.26;
  --c-mod:#2a78d6; --c-verb:#eb6834; --c-trans:#1baf7a; --c-cfg:#898781;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ color-scheme:dark; --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --edge-faint:#8a8984; --edge-op:.4; --c-mod:#3987e5; --c-verb:#d95926; --c-trans:#199e70; } }
:root[data-theme="dark"]{ color-scheme:dark; --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --edge-faint:#8a8984; --edge-op:.4; --c-mod:#3987e5; --c-verb:#d95926; --c-trans:#199e70; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--ring);border-radius:6px;padding:4px 10px}
button:hover{border-color:var(--axis)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
code{font-family:var(--mono);font-size:.95em}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
/* ---- header ---- */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:9px 16px;border-bottom:1px solid var(--grid);background:var(--surface)}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
header h1 small{font-weight:400;color:var(--ink-2);margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--ring);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 11px;color:var(--ink-2);background:var(--surface)}
.seg button+button{border-left:1px solid var(--ring)}
.seg button[aria-pressed="true"]{background:var(--surface);background:color-mix(in oklab,var(--ink) 9%,var(--surface));color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.ms-steps button{display:flex;flex-direction:column;align-items:center;line-height:1.1;padding:4px 9px;min-width:46px}
.ms-steps button .k{font-weight:600;font-variant-numeric:tabular-nums}
.ms-steps button .n{font-size:9.5px;color:var(--muted);letter-spacing:.02em;margin-top:1px}
.ms-steps button[aria-pressed="true"] .n{color:var(--ink-2)}
.legend{display:flex;gap:13px;align-items:center;color:var(--ink-2);font-size:12px;margin-left:auto;flex-wrap:wrap}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .ln{display:inline-block;width:18px;height:0;border-top:3px solid var(--ink);margin-right:5px;vertical-align:3px}
.legend .ln.dep{border-top:1.5px dashed var(--ink-2)}
.legend .rg{display:inline-block;width:10px;height:10px;border:2px solid var(--ink);border-radius:3px;margin-right:5px;vertical-align:-1px}
#search{border:1px solid var(--ring);border-radius:6px;padding:5px 9px;background:var(--surface);min-width:190px}
.sub{display:flex;gap:14px;align-items:center;padding:6px 16px;border-bottom:1px solid var(--grid);background:var(--surface);color:var(--ink-2);font-size:12px}
/* ---- main ---- */
main{display:grid;grid-template-columns:1fr 340px;min-height:0}
#boardwrap{overflow:auto;position:relative;background:var(--page)}
#view-matrix,#view-table{display:none;padding:18px 20px;overflow:auto}
#view-graph{display:none;position:relative;height:100%;overflow:hidden;background:var(--page)}
#gsvg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#gsvg.panning{cursor:grabbing}
.gctl{position:absolute;top:10px;left:12px;display:flex;gap:8px;flex-wrap:wrap;z-index:2;font-size:12px;align-items:center}
.gctl .seg button,.gctl>button{padding:4px 9px;background:var(--surface)}
.ghint{color:var(--muted);font-size:11px;background:var(--page);padding:2px 6px;border-radius:4px}
.ge{stroke:var(--edge-faint);stroke-width:1;opacity:.6;transition:opacity .15s}
.ge.contains{stroke-width:.7;opacity:.55}
.ge.composes{stroke-width:1.6}
.ge.depends{stroke-dasharray:4 3}
.ge.past{opacity:.16}
.ge.is-delta{stroke:var(--ink-2);opacity:.95;stroke-width:1.6}
.ge.hi{stroke:var(--ink);opacity:1;stroke-width:2.2}
.ge.hi.contains{stroke-width:1.2}
.ge.dim{opacity:.05}
.ge.hidden{display:none}
.gn{fill:var(--k);stroke:var(--surface);stroke-width:1.5;cursor:pointer;transition:opacity .15s}
.gn.function{opacity:.8}
.gn.is-past{opacity:.28}
.gn.is-future{opacity:.12;stroke-dasharray:2 2}
.gn.is-dim{opacity:.09}
.gn.is-delta{stroke:var(--ink);stroke-width:3;opacity:1}
.gn.is-touch{stroke:var(--ink);stroke-width:2;stroke-dasharray:3 2;opacity:1}
.gn.is-focus{stroke:var(--ink);stroke-width:3.5;opacity:1}
.gn.is-nb{opacity:1}
.gl{font:11px var(--mono);fill:var(--ink);paint-order:stroke;stroke:var(--page);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.gl.verb{font-weight:600}
.gl.function{font-size:9.5px;fill:var(--ink-2);display:none}
#gsvg.zoomed .gl.function,.gl.function.on{display:block}
.gl.off{opacity:.22}
.gmk path{fill:var(--edge-faint)} .gmk-mid path{fill:var(--ink-2)} .gmk-ink path{fill:var(--ink)}
.ge{fill:none}
.gr{fill:var(--k);fill-opacity:.05;stroke:var(--k);stroke-opacity:.5;stroke-width:1.2;pointer-events:all;cursor:default}
.gr.sub{fill-opacity:.04;stroke-opacity:.35;stroke-dasharray:3 3}
.gn.ring{fill:var(--k);fill-opacity:.10;stroke:var(--k);stroke-opacity:.9;stroke-width:1.4}
.gn.ring.is-delta,.gn.ring.is-focus{stroke:var(--ink)}
.gn.ring.is-past{opacity:.35} .gn.ring.is-dim{opacity:.1}
.grl{font:600 10px var(--font);letter-spacing:.08em;text-transform:uppercase;fill:var(--ink-2);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--page);stroke-width:3px}
.grl.sub{font-size:8.5px;fill:var(--muted);letter-spacing:.06em}
.gl.ringlab{text-anchor:middle;font-weight:600;font-size:9.5px}
#gsvg.pack .gl.verb{font-weight:500;font-size:9.5px}
#gsvg.pack .gl.config{font-size:9.5px}
.gclab{font:700 11px var(--font);letter-spacing:.1em;text-transform:uppercase;fill:var(--muted);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--page);stroke-width:4px}
.gzoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:2}
.gzoom button{width:30px;height:30px;padding:0;background:var(--surface);font-size:15px;line-height:1}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .gn:not(.ring){filter:drop-shadow(0 0 3px var(--k))} :root:not([data-theme="light"]) .gn.ring,:root:not([data-theme="light"]) .gr{filter:drop-shadow(0 0 7px var(--k))} :root:not([data-theme="light"]) .ge.hi,:root:not([data-theme="light"]) .ge.is-delta{filter:drop-shadow(0 0 2px var(--ink-2))} }
:root[data-theme="dark"] .gn:not(.ring){filter:drop-shadow(0 0 3px var(--k))} :root[data-theme="dark"] .gn.ring,:root[data-theme="dark"] .gr{filter:drop-shadow(0 0 7px var(--k))} :root[data-theme="dark"] .ge.hi,:root[data-theme="dark"] .ge.is-delta{filter:drop-shadow(0 0 2px var(--ink-2))}
:root[data-theme="light"] .gn,:root[data-theme="light"] .gr,:root[data-theme="light"] .ge{filter:none}
.board{position:relative;min-width:980px;padding:18px 18px 30px;display:flex;flex-direction:column;gap:56px}
.band{position:relative}
.band-h{display:flex;align-items:baseline;gap:8px;margin:0 0 10px 0;position:relative;z-index:3;flex-wrap:wrap}
.band-h h2,.band-h .cap{background:var(--page);padding:2px 6px;border-radius:4px}
.band-h h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0;font-weight:700}
.band-h h2 .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:0}
.band-h .cap{color:var(--muted);font-size:11.5px}
.band-h .cap code{color:var(--ink-2);font-size:11px}
.groups{display:flex;gap:10px 28px;flex-wrap:wrap;align-items:flex-start}
.group>.gl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px 2px;position:relative;z-index:3}
.group>.gl span{background:var(--page);padding:1px 4px;border-radius:3px}
.cards{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.flowrow{display:flex;gap:0 14px;align-items:flex-start;flex-wrap:nowrap}
.flow{display:flex;flex-direction:column}
.flow .cards{gap:0;flex-wrap:nowrap;align-items:stretch}
.flow.train{flex:none}
.flow.train .card{flex:0 0 150px}
.flow.daily{flex:1 1 0;min-width:0}
.flow.daily .card{flex:1 1 0;min-width:128px;max-width:196px}
.flowsep{align-self:center;width:26px;text-align:center;color:var(--muted);font-size:18px;line-height:1;margin-top:22px;user-select:none}
.engines{display:flex;gap:12px;justify-content:flex-end;align-items:center;margin-top:14px;flex-wrap:wrap}
.engines .ol{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px;max-width:260px;text-align:right}
.chev{flex:none;align-self:center;width:22px;text-align:center;color:var(--c-mod);font-size:20px;line-height:1;user-select:none;font-weight:700}
/* ---- card ---- */
.card{position:relative;z-index:0;background:var(--surface);border:1px solid var(--ring);border-left:4px solid var(--k);border-radius:8px;width:168px;padding:8px 9px 9px 10px;transition:opacity .18s,filter .18s,box-shadow .18s;cursor:default}
.card.verb{width:auto;padding:6px 9px 6px 9px}
.card.verb .ch{gap:8px;align-items:center}
.card.verb .nm{white-space:nowrap;font-size:11.5px;padding-right:0}
.card.verb .bl,.card.verb .hnd,.card.verb .st{display:none}
.card.verb .badge{position:static}
.card.verb.planned{border-style:dashed;opacity:.45;filter:saturate(0)}
.card.config{width:236px}
.card.tool{border-left-style:dashed}
.legend .sw.tool{background:transparent;border:1.5px dashed var(--c-cfg);box-sizing:border-box}
.row .mono.rm{text-decoration:line-through;opacity:.7}
.card:hover{box-shadow:0 1px 0 var(--ring),0 6px 18px -8px rgba(0,0,0,.35)}
.card .ch{display:flex;align-items:flex-start;gap:6px}
.card .num{flex:none;font:700 10px/1 var(--font);color:var(--surface);background:var(--c-mod);border-radius:4px;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.card .nm{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em;overflow-wrap:normal;word-break:normal;line-height:1.25;padding-right:30px}
.card.verb .nm::before{content:"$ ";color:var(--muted);font-weight:400}
.badge{position:absolute;top:7px;right:7px;font:600 9.5px/1 var(--font);letter-spacing:.03em;color:var(--ink-2);border:1px solid var(--ring);border-radius:4px;padding:3px 5px;background:var(--surface);background:color-mix(in oklab,var(--k) 9%,var(--surface))}
.card .st{font-size:10.5px;color:var(--muted);margin-top:3px}
.card .bl{font-size:11px;color:var(--ink-2);margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .bl{display:block}
.fns{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.fn{font:10.5px/1.3 var(--mono);color:var(--ink-2);background:var(--surface);background:color-mix(in oklab,var(--ink) 4%,var(--surface));border:1px solid var(--ring);border-radius:4px;padding:1px 5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.fn.hit{border-color:var(--ink);color:var(--ink);font-weight:600}
button.fn.more{cursor:pointer;color:var(--muted);border-style:dashed;padding:1px 6px}
button.fn.more:hover{color:var(--ink)}
.card:not(.open) .fn.hid{display:none}
.touch{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.touch span{font:600 9.5px/1 var(--font);padding:3px 5px;border-radius:4px;border:1px solid var(--ring);color:var(--ink-2);background:var(--surface);background:color-mix(in oklab,var(--ink) 4%,var(--surface))}
.touch span i{font-style:normal;color:var(--muted);font-weight:400;margin-left:3px}
/* ---- estados ---- */
.card.is-delta{box-shadow:0 0 0 2px var(--ink);z-index:2}
.card.is-touch{outline:2px dashed var(--ink);outline-offset:1px;z-index:2}
.card.is-past{opacity:.42;filter:saturate(.25)}
.card.is-future{opacity:.16;border-style:dashed;filter:saturate(0)}
.card.is-dim{opacity:.14;filter:saturate(0)}
.card.is-nb{opacity:1!important;filter:none!important;z-index:2}
.card.is-focus{opacity:1!important;filter:none!important;border-style:solid;box-shadow:0 0 0 2px var(--ink),0 8px 24px -8px rgba(0,0,0,.4);z-index:2}
/* ---- edges ---- */
#edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.board.focusing #edges{z-index:1}
#edges path.e{fill:none;stroke:var(--edge-faint);stroke-width:1.1;opacity:0;transition:opacity .15s}
#edges path.e.depends{stroke-dasharray:5 3}
#edges path.e.show{opacity:var(--edge-op)}
#edges path.e.is-delta{stroke:var(--ink-2);opacity:.6;stroke-width:1.3}
#edges path.e.hi{stroke:var(--ink);opacity:1}
#edges path.e.hi.composes{stroke-width:3}
#edges path.e.hi.depends{stroke-width:1.6}
#edges path.hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:none}
#edges path.hit.on{pointer-events:stroke}
#edges .mk-faint path{fill:var(--edge-faint)} #edges .mk-mid path{fill:var(--ink-2)} #edges .mk-ink path{fill:var(--ink)}
/* ---- aside ---- */
aside{border-left:1px solid var(--grid);background:var(--surface);overflow:auto;padding:16px 16px 28px}
aside h2{font-size:15px;margin:0 0 4px;letter-spacing:-.01em}
aside h2 code,aside .intent code{font-size:.92em;background:var(--page);padding:0 3px;border-radius:3px}
aside .intent{color:var(--ink-2);font-size:12px;margin:0 0 12px}
aside .status{display:inline-block;font-size:11px;color:var(--ink-2);border:1px solid var(--ring);border-radius:5px;padding:2px 7px;margin:0 0 12px}
aside .status::before{content:"✓ ";font-weight:700}
aside h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--grid)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border:1px solid var(--ring);border-radius:8px;padding:8px 9px;background:var(--page)}
.tile .v{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tile .v small{font-size:11px;font-weight:500;color:var(--muted);margin-left:3px}
.tile .l{font-size:10.5px;color:var(--ink-2);margin-top:2px}
.row{display:flex;gap:7px;align-items:baseline;margin:3px 0;font-size:12px}
.act{font:700 9px/1 var(--font);letter-spacing:.04em;padding:3px 5px;border-radius:4px;flex:none;border:1px solid var(--ring);color:var(--ink-2)}
.act.cond{border-style:dashed}
.mono{font-family:var(--mono);font-size:11px;color:var(--ink)}
.mono.k{color:var(--ink-2)}
.mono.fn{font-size:11px;background:none;border:0;padding:0;white-space:normal}
.cond-note{color:var(--muted);font-size:10.5px}
aside ul{margin:4px 0 0;padding-left:16px}
aside li{margin:3px 0;font-size:12px;color:var(--ink-2)}
.bars{display:grid;grid-template-columns:auto 1fr 30px;gap:6px 8px;align-items:center;font-size:11.5px}
.bars .lb{color:var(--ink-2);font-variant-numeric:tabular-nums;border:0;padding:0;text-align:left;background:none}
.bars .lb b{font-weight:600;color:var(--ink)} .bars .lb span{color:var(--muted);margin-left:5px}
.bars .tr{height:16px;position:relative}
.bars .tr i{position:absolute;left:0;top:0;height:16px;background:var(--ink-2);border-radius:0 4px 4px 0;display:block}
.bars .vv{color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.detail{border:1px solid var(--ring);border-radius:8px;padding:10px 11px;margin:0 0 14px;background:var(--page);position:relative}
.detail .x{position:absolute;right:8px;top:8px;border:0;color:var(--muted);padding:2px 6px}
.detail .kd{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.detail .kd .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.detail .nm{font-family:var(--mono);font-size:13px;font-weight:600;margin:3px 0 4px}
.detail p{margin:4px 0;color:var(--ink-2);font-size:12px}
.more-files{border:0;padding:0;color:var(--muted);font-size:11.5px;text-decoration:underline dotted;margin-top:4px}
.hint{color:var(--muted);font-size:11.5px;margin:8px 0 0}
kbd{font:11px var(--mono);border:1px solid var(--ring);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink-2)}
/* ---- tooltip ---- */
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:6px;padding:7px 9px;font-size:11.5px;line-height:1.35;max-width:300px;box-shadow:0 8px 24px -8px rgba(0,0,0,.5);display:none}
.tip b{font-weight:600}
.tip .mt{opacity:.72;margin-top:3px}
/* ---- matriz ---- */
.mx{border-collapse:separate;border-spacing:0;font:11px var(--mono)}
.mx th{font-weight:500;color:var(--ink-2);text-align:left;padding:3px 6px;white-space:nowrap}
.mx thead th{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;vertical-align:bottom;padding:6px 0;height:150px}
.mx td{width:22px;height:22px;text-align:center;border-top:1px solid var(--grid);border-left:1px solid var(--grid);padding:0}
.mx td button{width:22px;height:22px;border:0;border-radius:0;padding:0;display:block}
.mx td button i{display:block;width:12px;height:12px;margin:5px;border-radius:3px;background:var(--ink-2)}
.mx td button:hover{background:var(--grid)}
.mx tr.is-off th,.mx tr.is-off td button i{opacity:.18}
.mx .diag{background:var(--grid)}
.mx tr th.rk{border-left:3px solid var(--k);padding-left:7px}
.mx thead th.ck{border-bottom:3px solid var(--k)}
.mxnote{color:var(--ink-2);font-size:12px;margin:0 0 12px;max-width:760px}
/* ---- tabela ---- */
.tbl{border-collapse:collapse;font-size:12px;min-width:720px;margin-bottom:22px}
.tbl th{text-align:left;color:var(--ink-2);font-weight:600;border-bottom:1px solid var(--axis);padding:6px 8px;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--grid);padding:5px 8px;vertical-align:top}
.tbl td.m{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.tbl tr.is-off td{opacity:.35}
.tbl caption{text-align:left;font-weight:600;color:var(--ink);padding:0 0 8px;font-size:13px}
@media (max-width:1000px){ main{grid-template-columns:1fr} aside{border-left:0;border-top:1px solid var(--grid)} #app{grid-template-rows:auto auto auto auto;height:auto} .tiles{grid-template-columns:repeat(2,1fr)} }
@media print{ aside,header .legend,#search{display:none} .card{break-inside:avoid} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>prevcarga <small>topologia interna do pacote · M1→M8</small></h1>
    <div class="seg ms-steps" id="steps" role="group" aria-label="Milestone"></div>

eterminístico e order-insensitive (até chaves aninhadas), run-manifest de 12 campos com bundle_id=hash, freeze/thaw saveRDS com round-trip Δ=0","Fachada Rscript+docopt fina: usage enumera TODOS os verbos, runtime-first antes do corpo de todo comando guardado (doctor/status/-h isentos), despacho fino sem lógica de modelo","Taxonomia de exit-code por classe (ADR-0020): 0/2/3/4/5/6/7, com runtime=7, mapeada por prefixo único de erro; --format text|json global","5 comandos de introspecção novos (status/doctor/models/areas/describe) compondo os 3 módulos, sem valores/contagens locais; doctor porta o gate de runtime reportando sem abortar","registry.R: fronteira de contrato de tiers A/B (ADR-0010) com verificação fail-loud em wire-time; ciclo-de-vida (ls/promote/rollback/pin/gc) fica para o M5"],"verbs":[{"name":"status","note":"novo: deck mais recente usável + idade do bundle + resumo do doctor; isento do enforce (best-effort, pode reportar sem deck)"},{"name":"doctor","note":"novo: prevcarga_runtime_check() → PASS/WARN/FAIL por linha (TZ/LC/4 pins/pool BLAS/R-renv/arrow); isento do enforce; exit 7 se FAIL duro; porta o gate M1.1"},{"name":"models","note":"novo: tabela sigla·mdir·exogena·horizon·history lida só de topology.R/run.yaml (zero literal)"},{"name":"areas","note":"novo: árvore folha→subsistema→SIN com perdas, na ordem $order, do config carregado (só --format)"},{"name":"describe","note":"novo: topologia + model_spec + corte lido do manifest; declara 'corte-de-treino derivado no M2', não inventa data"}]},"M2":{"id":"M2","title":"M2 — Datas honestas (3 cortes) + validação model-agnóstica + `validate-deck` (gate-0)","intent":"Colisão de datas é o risco #1 do sistema: um erro de ±1 dia no corte de treino infla a acurácia em silêncio e passa por todas as métricas (ADR-0006). M2 colapsa em R-only os três conceitos de data que \"cortar dados pra trás\" funde (forecast-origin, corte-de-treino, corte-intradiário) e sobe cedo o validate-deck (gate-0), barato, que protege /emissão) que o validate-deck impõe; enum-fino de feriado [DEFERRED] a formalizar aqui"},{"path":"scripts/lib/README.md","action":"EDITAR","note":"DoD write-through PARCIAL: só a linha de validation.R (completude DST-aware → flat-48); a linha de dates.R fica INTACTA/conforme ao ADR-0006 (opção b)"}],"functions":[{"name":"prevcarga_train_origin","module":"dates","signature":"prevcarga_train_origin(as_of, model, root = ...)","note":"M2.1 — corte-de-treino por-protocolo via model_spec; daily (RF/LGBM) = as_of−1−horizon_days (porta jl_train_origin job_lib.sh:230); retrain_harness (dessem/HW) stop [prevcarga/todo] [DEFERRED M5]; Date naive-BRT; root = alavanca de injeção de path"},{"name":"prevcarga_resolve_cuts","module":"dates","signature":"prevcarga_resolve_cuts(as_of, data_dir, model = NULL)","note":"M2.1 — devolve {forecast_origin, train_cut, intraday_cut} ancorados na MESMA origem resolvida; origem default = último dia completo (chama day_complete); intraday do manifest.json; model=NULL → tabela por-modelo (daily computado, retrain_harness marcado [M5]), nunca escalar"},{"name":"prevcarga_validate_deck","module":"validation","signature":"prevcarga_validate_deck(data_dir, as_of, scope = NULL, format = \"text\")","note":"M2.2 — abre store Hive, roda 5 classes de checagem acumulando (fail-por-origem, ADR-0005); devolve list(ok, class, findings[area/dataset/what/detail/class/level]); class-dona por severidade contract>completude>topology>window; NÃO devolve exit_code"},{"name":"prevcarga_day_complete","module":"validation","signature":"prevcarga_day_complete(day)","note":"M2.2 — predicado único exposto: dia completo = 48 slots/dia (:00/:30), flat-48 (ADR-0002/0003, DST absorvido na malha); MESMO predicado que resolve_cuts chama (fonte única, anti-contador-paralelo)"},{"name":"prevcarga_data_hash","module":"provenance","signature":"prevcarga_data_hash(data_dir)","note":"M2.3 — primitivo NOVO: sha256 sobre a lista ordenada por caminho Hive dos sha256 de cada area_code=/year=/data.parquet; exclui o 'corte' do manifest; model-agnóstico; é o data_fingerprint que train/forecast alimentam ao version_hash (M1.3)"},{"name":"cmd_validate_deck","module":"prevcarga","signature":"cmd_validate_deck(args)","note":"M2.3 — dispatch fino: resolve --dados/--as-of/--model/--area/--format, chama resolve_cuts + validate_deck; mapeia class→exit-code (2/3/4/5) pelo handler M1.4; --format json emite {ok,class,exit_code,as_of,data_hash,findings}"},{"name":"cmd_describe","module":"prevcarga","signature":"cmd_describe(args)","note":"M2.3 — re-ligado: substitui o placeholder 'derivado no M2' do M1.5; imprime origem + corte-de-treino daily via train_origin (sem --dados); retrain_harness = '[derivado no M5]'; aposenta o AC-negativo do M1.5:416","edited":true}],"functionality":["Deriva os 3 cortes (forecast-origin, train-cut, intraday-cut) do único --as-of, ou do último dia completo do store quando --as-of é NULL — os três ancorados na MESMA origem resolvida","Corte-de-treino daily (RF/LGBM) = origem−1−horizonte por-modelo (porta jl_train_origin); retrain_harness (dessem/HW) faz stop [DEFERRED M5] (opção b, não contradiz ADR-0006)","Validação model-agnóstica do deck em 5 classes: schema/tipo/tz-naive-BRT, completude flat-48, sanidade física (carga>0/dedup/clima −10..50 hard; outlier/flatline warning), clima honesto, janela mínima","Veredito estruturado acumulado por origem (ADR-0005 fail-por-origem) — não aborta no 1º erro; class-dona por severidade contract>completude>topology>window","Comando validate-deck (gate-0 standalone) com exit-codes por classe 2/3/4/5 (ADR-0020) + --format json com exit ortogonal à saída","prevcarga_data_hash: digest content-addressed do store parquet Hive (exclui o corte do manifest, ordem-estável por caminho Hive) — pin de entrada para --expect-data-hash de M5/M6","Honestidade do clima elevada ao nível-deck: issue_time ≤ intraday_cut no frame UTC (to_utc(t_BRT)=t_BRT+3h), reportado antes do compute","Re-liga describe mostrando os cortes deriváveis sem o deck (origem + corte daily; retrain_harness = [M5]) e aposenta o teste-irmão negativo do M1.5"],"verbs":[{"name":"validate-deck","note":"M2.3 torna-se dono (já na gramática docopt do stub :25, hoje stop de não-dono do M1.4): veredito estruturado + exit-codes por classe 2/3/4/5 + --format json + data_hash; verbo GUARDADO (runtime-first, stdout-vazio sob env sujo)"},{"name":"describe","note":"M2 EDITA (criado no M1.5): re-ligado p/ imprimir origem + corte-de-treino daily via train_origin (gramática M1 sem --dados); retrain_harness = '[derivado no M5]'; intraday anotado 'do deck, via validate-deck'"}]},"M3":{"id":"M3","title":"M3 — Avaliação fonte-única + honesty-gate + `score` + `check-coherence`","intent":"A honestidade que o isolamento-de-processo (G5) garantia some quando a combina (M4) colapsa in-process; ela precisa virar invariante de módulo provado por gate falsificável ANTES da combina migrar. Em paralelo o WMAPE vive em ~11 lugares divergentes: o M3 colapsa isso em evaluation.R (fonte única) + honesty_gate.R (molde falsificável reusável) + os verbos score (acurácia vs y_true fresco, review D+1) e check-coherence (SIN=Σsubsistemas; subsistema=Σregiões·k̂). Nenhum modelo migra aqui.","status":"VERIFY-READY (M3): ready:true · 0 blockers · 6/6 reviewers unânime (2026-10-13, ~11 rounds). Pronto pra implement, com pré-requisitos/decisões do Gabriel (candidatos a ADR + 4 correções de premissa repo-vence).","docPath":"docs/roadmap/M3-AVALIACAO.md","files":[{"path":"scripts/lib/evaluation.R","action":"ATIVAR","note":"Destuba (hoje stop TODO M3 :13-19): fonte única de métrica + skill-score + baselines + scorecard + read_actual (M3.1+M3.3)."},{"path":"scripts/lib/honesty_gate.R","action":"ATIVAR","note":"Destuba (hoje stop TODO M3 :16-18): molde in-process FORBIDDEN/CONTROL/CLEAN2 (M3.2)."},{"path":"scripts/prevcarga","action":"ESTENDER","note":"Estende a gramática docopt Usage: (:19-26) com score e check-coherence (hoje só no comentário :11) + cmd_score()/cmd_check_coherence() + wiring class→exit-code (M3.3+M3.4)."},{"path":"docs/ESTADO-ATUAL.md","action":"EDITAR","note":"Write-through em 2 seções: 'Onde estamos' (M3 vivo + correções de premissa) e §esqueleto (:96,100-101: tira evaluation/honesty_gate dos stubs)."},{"path":"docs/reference/METRICAS-CANONICO.md","action":"CRIAR","note":"Novo doc de referência (espelho humano do contrato de métrica) — ⚠ candidato a [DEFERRED]/decisão do Gabriel; evaluation.R É a fonte única em código."},{"path":".claude/workflows/implement-milestone.js","action":"EDITAR","note":"Adiciona CHECKPOINTS['M3']/'M3-AVALIACAO' → _M3_CP (deployByDefault:false, passCriteria testthat-only) — pré-implement."},{"path":"scripts/lib/tests/","action":"CRIAR","note":"Suíte testthat nova do M3 (fixtures de LONG parquet minúsculos + stores de carga realizada em tmp, nunca o data/ real)."},{"path":"scripts/lib/README.md","action":"EDITAR","note":"Write-through: linhas evaluation.R e honesty_gate.R passam de 'a implementar (M3)' → 'vivo'."},{"path":"docs/roadmap/README.md","action":"EDITAR","note":"Write-through do índice vivo: linha M3 (:26) → ✅ VERIFY-READY (CHECKPOINTS wirado)."}],"functions":[{"name":"prevcarga_wmape","module":"evaluation","signature":"prevcarga_wmape(y_true, y_pred, weights = NULL)","note":"100*sum(|y_pred−y_true|)/sum(|y_true|) sobre pares finitos (is.finite), NA_real_ se vazio; denom COM abs; ÚNICA definição de WMAPE do repo. weights inerte (sem consumidor, [DEFERRED])."},{"name":"prevcarga_mape","module":"evaluation","signature":"prevcarga_mape(y_true, y_pred)","note":"100*mean(|e/y_true|) EXCLUINDO y_true==0 (não floor pmax 1e-9)."},{"name":"prevcarga_mae","module":"evaluation","signature":"prevcarga_mae(y_true, y_pred)","note":"mean(|e|)."},{"name":"prevcarga_rmse","module":"evaluation","signature":"prevcarga_rmse(y_true, y_pred)","note":"sqrt(mean(e²)); RMSE ≥ MAE (Jensen)."},{"name":"prevcarga_bias","module":"evaluation","signature":"prevcarga_bias(y_true, y_pred)","note":"mean(e) em MW com sinal (bias>0 ⇒ over-forecast) + bias_pct = 100*Σe/Σ|y_true| (ratio-of-sums, não mean-of-ratios)."},{"name":"prevcarga_peak_wmape","module":"evaluation","signature":"prevcarga_peak_wmape(target_datetime, y_true, y_pred, hours = 18:22)","note":"WMAPE restrito às horas de ponta FIXAS 18-22h (comunicável, protocolo-agnóstica). ramp/timing/peak-por-regime [DEFERRED M4]."},{"name":"prevcarga_baseline","module":"evaluation","signature":"prevcarga_baseline(data_dir, area, origin, kind = \"persistence\")","note":"Builder de baseline por-slot (toca o store): persistence=y_slot(O−1), seasonal_naive=y_slot(O−7); lê carga realizada < origem (honesto); devolve LONG de baseline."},{"name":"prevcarga_skill_score","module":"evaluation","signature":"prevcarga_skill_score(long, baseline_long)","note":"PURA: skill = 1 − WMAPE_modelo/WMAPE_baseline por d_plus/área; recebe baseline como DADO (LONG pré-computado), sem path/store."},{"name":"prevcarga_scorecard","module":"evaluation","signature":"prevcarga_scorecard(long, by = c(\"d_plus\",\"area\"), baseline_long = NULL)","note":"Motor único (score/backtest/forecast --report). Consome schema LONG 8-col, filtra is.finite, agrega WMAPE/MAPE/MAE/RMSE/BIAS/peak por `by`, anexa skill se baseline_long dado. Puro e horizon-aware; rollup subsistema/SIN é consumer-side. Renomeia o param do stub baseline→baseline_long."},{"name":"prevcarga_read_actual","module":"evaluation","signature":"prevcarga_read_actual(data_dir, area, from = NULL, to = NULL)","note":"Primitivo NOVO do M3.3: lê <data_dir>/load/area_code=<area>/year=*/data.parquet, schema CANÔNICO load_mwh+timestamp, naive-BRT, ts_r30=round(epoch/1800)*1800, mean por slot. Fail-high (stop [prevcarga/contract] exit 2) se coluna canônica faltar; partição inexistente → vazio."},{"name":"prevcarga_honesty_gate","module":"honesty_gate","signature":"prevcarga_honesty_gate(run_fn, panel, origin, horizon)","note":"Molde in-process reusável. Perturba CÓPIAS do panel: CLEAN2 (determinismo ≤1e-5), FORBIDDEN (perturba SÓ y_true em target≥origem, exige Δ≤1e-5 + alcance provado), CONTROL (perturba y_true em O−1, exige Δ>1e-5). Veredito HONESTO/VAZA/INDETERMINADO/HARNESS QUEBRADO. Horizonte cheio ~9. MORNING/available_until [DEFERRED M5]."},{"name":"cmd_score","module":"prevcarga","signature":"cmd_score(args)","note":"Dispatch fino no facade: resolve flags, re-junta y_true FRESCO uniforme (sobrescreve embutido), pré-computa baseline_long (fan-out por área), chama scorecard, valida --area via prevcarga_topology (exit 4), carimba data_hash+as_of. Verbo guardado (runtime-first)."},{"name":"cmd_check_coherence","module":"prevcarga","signature":"cmd_check_coherence(args)","note":"Lê a árvore via prevcarga_topology() (nunca yaml direto nem members()); checa (a) SIN=Σsubsistemas, (b) k̂∈[1.0,1.15], (c) completude de nó emitível (exclui loss nodes, só em cobertura-comum); acumula findings; exit contract(2)/completude(3)/topology(4)/0."}],"functionality":["Colapsa WMAPE de ~11 implementações divergentes (3 famílias) numa fonte única em evaluation.R, provada por grep (consumidores chamam, não redefinem).","Métrica de acurácia canônica: WMAPE (denom Σ|y_true| com abs, máscara is.finite), MAPE (exclui y_true==0, não floor), MAE, RMSE, BIAS (MW com sinal + bias_pct ratio-of-sums), peak-WMAPE em janela FIXA 18-22h.","Skill-score (1 − WMAPE_modelo/WMAPE_baseline) + baselines por-slot criados do zero (persistence=O−1, seasonal_naive=O−7), lidos honestos < origem.","Honesty-gate falsificável in-process (CLEAN2/FORBIDDEN/CONTROL, limiar |Δ|≤1e-5, horizonte cheio ~9, alcance provado) reusável por módulo — invariante antes da combina (M4) migrar.","Verbo score: re-junta y_true fresco do store de forma UNIFORME (sobrescreve o embutido), manchete d_plus=1, exit-codes por classe (2/4/0), zero-overlap=exit 0 informativo.","Verbo check-coherence: (a) SIN=Σsubsistemas, (b) k̂∈[1.0,1.15], (c) completude de nó emitível (exclui loss nodes), lendo a árvore de topology.R (N=5/24-folhas, nunca hardcode).","scorecard puro e horizon-aware (por d_plus+area) é o motor único de score (M3), backtest (M7) e forecast --report (M6).","read_actual canônico (schema load_mwh fail-high, sem auto-detecção por aliases — ADR-0004/0005), porta só a mecânica de agregação ts_r30/mean."],"verbs":[{"name":"score","note":"NOVO verbo (estende gramática docopt): pontua um LONG publicado vs y_true FRESCO re-juntado do store (review D+1, manchete d_plus=1), acurácia + skill-score vs baseline, --format json, exit-codes por classe, zero-overlap=exit 0. ≠ verificar (reprodução sha256/TOL)."},{"name":"check-coherence","note":"NOVO verbo (estende gramática docopt): verifica coerência hierárquica de um LONG reconciliado — (a) SIN=Σsubsistemas aditiva + (b) k̂=subsistema/Σregiões ∈ [1.0,1.15] multiplicativa + (c) completude estrutural de nó emitível; acumula findings por instante; --format json."}]},"M4":{"id":"M4","title":"M4 — Módulo combination (combina dissolvida, leak corrigido em voo)","intent":"Reescreve a combina — o único Python que o `prever` diário executa e portadora do leak #1 — direto como módulo R `scripts/lib/combination.R` (numpy-puro → R-base, zero dep nova), corrigindo o vazamento de horizonte EM VOO (corte por data-alvo, não `ym<m`). 1º módulo numérico in-process: onde a honestidade vira invariante de módulo (1º a passar o honesty_gate do M3 e a assertiva de determinismo do M1). Só o módulo + o comando `combine` standalone migram; o flip de produção é M6, o bundle R-only é M8.","status":"VERIFY-READY (ready:true · 6/6 reviewers unânime · 0 landmines bloqueantes por 6 rounds R8–R13, 2026-10-13). Pronto pra implement, pendente ratificações do Gabriel (solver FISTA vs QP, ε, corte per-mês, eixo ADR-0013).","docPath":"docs/roadmap/M4-COMBINA.md","files":[{"path":"scripts/lib/combination.R","action":"CRIAR","note":"Módulo combina R-base (criado do zero; reservado em README.md:16): núcleo Duchi/FISTA/produce/eqw (M4.1), IO/painel/descoberta (M4.2), freeze/apply (M4.3), gates A/B (M4.4)."},{"path":"scripts/prevcarga","action":"ESTENDER","note":"cmd_combine() + extensão da gramática docopt `Usage:` (:19-26) com `combine` (hoje só no comentário :12). M4.4."},{"path":"scripts/lib/tests/","action":"CRIAR","note":"Suíte testthat nova do M4 (solver + IO/painel + freeze/split-parity + gates; fixtures parquet minúsculos por fórmula fechada, não np.random). Todos os tickets."},{"path":"docs/ESTADO-ATUAL.md","action":"EDITAR","note":"Write-through 'Onde estamos' (M4 vivo: combina R, leak corrigido) + §esqueleto (combination.R deixa de ser 'a criar') + ressalva de que os números de backtest VÃO mudar. DoD cross-cutting."},{"path":"scripts/lib/README.md","action":"EDITAR","note":"Linha combination.R → vivo (M4)."},{"path":".claude/workflows/implement-milestone.js","action":"EDITAR","note":"Pré-implement: adicionar CHECKPOINTS['M4']/'M4-COMBINA' → _M4_CP; APOSENTAR o _COMBINA_CP estale (:65-81, terminal M1–M6); re-apontar/remover 'M-combina'/'MIGRACAO-COMBINA-R' (:123-124) → _M4_CP."},{"path":"docs/roadmap/README.md","action":"EDITAR","note":"Linha M4 → ✅ VERIFY-READY."},{"path":"docs/roadmap/COMBINA-TECNICO-M4.md","action":"EDITAR","note":"Reconciliar banner (M5/M6 internos = flip→M6/bundle→M8; combina_baseline.R→combination.R; MEMBERS→prevcarga_members()); 5º invariante interp→refit_per_cut (:136); anti-padrão Δw→Δ y_pred (:109); '24 áreas'→células fitadas do fixture (:140/:176)."}],"functions":[{"name":"prevcarga_proj_simplex","module":"combination","signature":"prevcarga_proj_simplex(v)","note":"Projeção euclidiana no simplex (Duchi 2008); rho=último True (tail(which(cond),1), NÃO which.max); length==1 → 1.0. Porta combina_baseline.py:204-214. M4.1."},{"name":"prevcarga_fit_convex","module":"combination","signature":"prevcarga_fit_convex(X, y, w0=NULL, iters=500, grad_tol=1e-6)","note":"FISTA no sistema normal k×k; parada ÚNICA por gradiente projetado (grad_tol) OU cap (emite warning + flag não-estacionário); SEM parada por step-change. Devolve (w, a). Reimplementa em R-base (pendente ratificação FISTA vs QP). M4.1."},{"name":"prevcarga_produce_combined","module":"combination","signature":"prevcarga_produce_combined(panel, weights)","note":"Intercepto a FIXO; membro faltante renormaliza SÓ os pesos presentes (wv/s, a NÃO renormalizado); fallback s==0 → mean(na.rm). Porta :285-306. M4.1."},{"name":"prevcarga_produce_eqw","module":"combination","signature":"prevcarga_produce_eqw(panel)","note":"Piso equal-weight rowMeans(f_*, na.rm=TRUE). Porta :309-313. M4.1."},{"name":"prevcarga_combina_discover","module":"combination","signature":"prevcarga_combina_discover(root, area)","note":"Lista de membros do MANIFESTO (prevcarga_members, ADR-0013(a) — nunca glob-no-disco); localiza run por identidade (mdir,EXOGENA) run-mode-agnóstica (lê _infer); fail-hard se >1 run-mode casar; membro com 0 runs = coluna all-NA (não fail-hard). M4.2."},{"name":"prevcarga_build_panel","module":"combination","signature":"prevcarga_build_panel(long)","note":"dcast de y_pred + reindex a prevcarga_members() (colunas f_<membro>, ausentes=NA, ordem canônica); não materializa y_true de membro. Porta :172-191. M4.2."},{"name":"prevcarga_join_fresh_truth","module":"combination","signature":"prevcarga_join_fresh_truth(panel, data_dir, area)","note":"Reusa prevcarga_read_actual (M3.3, load_mwh fail-high, ts_r30); sobrescreve y_true por fresco (NA onde não casa); tz sem shift (naive-BRT, ADR-0003). Porta :45-78. M4.2."},{"name":"prevcarga_broadcast_cut","module":"combination","signature":"prevcarga_broadcast_cut(panel)","note":"Difunde a PREVISÃO (nunca o peso) de membros cut-invariantes (RF/HW) por todos os cortes presentes, só no caso misto. Porta :138-154. M4.2."},{"name":"prevcarga_combina_train","module":"combination","signature":"prevcarga_combina_train(area, panel, artifact_dir)","note":"fit_convex expansível por (lead,corte,mês), corte por data-alvo; congela list(meta,weights) via prevcarga_freeze (saveRDS) em v_<version_hash> content-addressed + ponteiro latest; carimba run-manifest (member_set_hash load-bearing). M4.3."},{"name":"prevcarga_combina_apply","module":"combination","signature":"prevcarga_combina_apply(area, artifact_dir, panel, t_cut=NULL)","note":"prevcarga_thaw(latest) → produce_combined com pesos congelados do corte t_cut (sem re-fit); emite schema LONG 8-col; área não-treinada → stop() alto. Multi-corte [DEFERRED M6]. M4.3."},{"name":"prevcarga_combina_full","module":"combination","signature":"prevcarga_combina_full(panel)","note":"Modo weights=NULL ⇒ full (fit+apply num passo); é o run_fn que o G2 do M4.4 envolve. M4.3."},{"name":"prevcarga_combina_gate","module":"combination","signature":"prevcarga_combina_gate() / scorecard A/B","note":"Gates do M4.4: G2 honestidade (via prevcarga_honesty_gate M3.2, run_fn=FULL wrapped forecast_origin==origin) + otimalidade (gradiente projetado células fitadas) + qualidade A/B (WMAPE≤best-member/EQW). M4.4."},{"name":"cmd_combine","module":"prevcarga","signature":"cmd_combine(args)","note":"Comando combine standalone; modos train/apply/full; verbo GUARDADO (runtime-first, exit 7); dispatch fino (lógica em combination.R). M4.4."}],"functionality":["Reescreve a combina (único Python do `prever` diário, run_reduce.sh:83) como módulo R-base `combination.R` — numpy-puro → R-base, sem scipy, zero dep nova de produção.","Corrige o leak #1 de horizonte EM VOO: corte de treino dos pesos por data-alvo `target_datetime < início-do-mês(m)` por (lead,corte,mês-de-origem), substituindo o `ym<m` que incluía alvos futuros.","Núcleo numérico: projeção Duchi no simplex + FISTA no sistema normal com parada por gradiente projetado (não step-change) + produce_combined (renorm só pesos presentes) + produce_eqw.","IO/painel/descoberta run-mode-agnóstica: lista de membros do manifesto `prevcarga_members()` (nunca glob), localiza runs por identidade (mdir,EXOGENA) lendo `_infer`, fail-hard em dupla-contagem.","Freeze `saveRDS` binário content-addressed (v_<version_hash>, não JSON/timestamp) + ponteiro latest + apply por-corte; split-parity R-vs-R apply(load(train()))==full Δ=0 com CONTROL-com-dente.","Gate G2 de honestidade reescrito nasce verde via o molde do M3.2 (run_fn=FULL, FORBIDDEN target≥origem / CONTROL target≤O−1), provando o leak-fix — 1º módulo a passar o honesty_gate.","Gate de otimalidade NOVO (gradiente projetado<1e-6 em células fitadas, exclui fallback/cap-hit) — substitui a paridade de solver ausente (ADR-0014).","A/B de qualidade por WMAPE≤best-member/≤EQW ESTRITO (ε=0 default) + comando `combine` standalone (train/apply/full) na gramática docopt."],"verbs":[{"name":"combine","note":"Verbo-CLI standalone introduzido no M4: estende a gramática docopt `Usage:` (scripts/prevcarga:19-26, hoje só no comentário :12); modos train/apply/full; verbo GUARDADO (runtime-first, exit 7); dispatch fino, lógica mora em combination.R."}]},"M5":{"id":"M5","title":"M5 — Training/Inference fachadas + FE-fachada + `train-models`/`infer-model` + registry","intent":"Entrega a fachada de FE que padroniza as 5 assinaturas divergentes dos plugins (o trabalho real) + fachadas R de training/inference (módulo = função R in-process, ADR-0018). `train-models` deriva corte honesto POR MODELO (M2) com subset DESBLOQUEADO (remove `_require_sin_scope`); `infer-model` lê params 100% do artefato (recusa re-especificar); version=hash content-addressed + run-manifest; verbo `registry` (ls/show/promote-atômico/rollback/pin/gc); gates por-modelo portados.","status":"VERIFY-READY (ready:true · 6/6 reviewers unânime · 0 landmines/controles bloqueantes · convergido em 12 rounds). Pronto pra implement. BLOQUEIO-CHAVE: ratificações do Gabriel antes do implement — (1) SUPERSEDER do ADR-0006 (formaliza 2 semânticas de corte; bloqueia os 3 gates retrain_harness dessem/HW + o MORNING; os 2 daily RF/LGBM são superseder-independentes); (2) ADR de lifecycle-registry + dimensão variant/EXOGENA; (3) FE-fachada nome/assinatura vs ADR-0009; (4) verbo infer-model dessem `_infer` vs `predict`; (5) exit-codes + freshness-clima + dono-protocol. Pré-requisitos M1/M2 AUSENTES no clean-room (provenance.R/dates.R/topology.R stubs; models//config//5 run.yaml + código R dos 5 plugins).","docPath":"docs/roadmap/M5-TRAINING.md","files":[{"path":"scripts/lib/features.R","action":"CRIAR","note":"FE-fachada: assinatura canônica prevcarga_build_features + 5 adapters finos (dispatch-fino, zero FE compartilhada ADR-0009) + transforms to_model_frame/to_display_frame. Nome provável — candidato a clarificação se colidir com verbo features (M6) ou morar em training.R."},{"path":"scripts/lib/training.R","action":"CRIAR","note":"training-fachada prevcarga_train(spec,data,params)→artefato; normaliza as 5 assinaturas de train; corte honesto por-protocolo via dates.R (nenhuma lógica de corte re-hardcoded aqui)."},{"path":"scripts/lib/inference.R","action":"CRIAR","note":"inference-fachada prevcarga_infer + 5 adapters + loader único; params 100% do artefato (recusa re-especificar)."},{"path":"scripts/lib/registry.R","action":"ESTENDER","note":"Sobre a fronteira M1.6 (ADR-0010): adiciona ciclo de vida ls/show/promote-atômico/rollback/pin/gc + prevcarga_resolve_version; dono designado/fonte única do ciclo. Se M1.6 não materializou a fronteira, o M5 a cria junto."},{"path":"scripts/prevcarga","action":"EDITAR","note":"Gramática docopt: verbos train-models/infer-model/registry + alias treinar→train-models (aviso de depreciação direciona a train-models + combine); handler prefixo→exit-code estendido (classes 4 topology / 5 window)."},{"path":"models/<m>/tests/run_all_gates.R","action":"CRIAR","note":"Portar p/ o clean-room R-only os sub-gates [M5] model-native dos 5 arquivos (RF/LGBM/HW/dessem-linear/dessem-regdin); schema_long→M6, harness_*→M7 ficam deferidos."},{"path":"scripts/lib/honesty_gate.R","action":"ESTENDER","note":"Braço MORNING (do M3 [DEFERRED M5]): perturba carga [O 00:00, O<cut], exige |Δ|>1e-5 = uso da manhã via feature mm. SÓ DESSEM (HW é cut-invariante). [pós-superseder 0006]. Reach-control generalizado NÃO entra (→M6)."},{"path":"scripts/lib/dates.R","action":"EDITAR","note":"[pós-superseder 0006] Preencher o ramo retrain_harness de prevcarga_train_origin/prevcarga_resolve_cuts (série ≤O−1, ramifica no protocol do manifesto). Função é de M2; o ramo retrain_harness (opção-a) é do M5. Daily (opção-b) fica intacto."},{"path":"scripts/lib/topology.R","action":"EDITAR","note":"[pré-implement] prevcarga_model_spec(model, root, overrides=) resolve o spec EFETIVO (run.yaml ⊕ overrides CLI --horizon/--exogena), consumido pelo corte (dates.R) e pelo version_hash. Cresce o contrato M1 do model_spec (candidato a clarificação ADR-0021). Superseder-independente (daily)."},{"path":".claude/workflows/implement-milestone.js","action":"EDITAR","note":"CHECKPOINTS['M5']/'M5-TRAINING' → _M5_CP (deployByDefault:false; abReference determinístico por-modelo nos limiares ADR-0017 ≤1e-5/≤0,1 MW)."}],"functions":[{"name":"prevcarga_build_features","module":"features","signature":"prevcarga_build_features(spec, deck, params=list())","note":"Assinatura canônica da FE-fachada (forma (deck,params) já é a de 3/5) + 5 adapters finos que normalizam RF (validador-WIDE, sem build)/LGBM (preserva split interno train_cutoff/val_cutoff)/dessem (no-op com contrato declarado)/HW (named list de frames + tokens estruturais deck.*)."},{"name":"to_model_frame","module":"features","signature":"to_model_frame(x)","note":"Transform de alinhamento: carimbo fim→início, desloca por exatamente −granularity_min DO FRAME em que opera (dessem = frame horário pós-agregação = −3600s). Round-trip com to_display_frame = identidade (ADR-0019/0012)."},{"name":"to_display_frame","module":"features","signature":"to_display_frame(x)","note":"Inverso: início→fim (+1 intervalo). Output-preserving → preserva o A/B Δ=0 do dessem."},{"name":"prevcarga_train","module":"training","signature":"prevcarga_train(spec, data, params)","note":"training-fachada: normaliza train_hw_model/train_multioutput_rf/train_dessem_*/train_lgbm num contrato único → artefato auto-descritivo; FE por-plugin preservada; herda requires/provides (M5.1)."},{"name":"prevcarga_infer","module":"inference","signature":"prevcarga_infer(spec, artifact, inference_features)","note":"inference-fachada canônica + 5 adapters: HW (hw_infer); RF (extrai sub-lista y_h* antes de predict_rf); LGBM (infer_single_origin, só artifact$min_max_BLF); dessem (_infer vs predict — decisão do Gabriel). Params 100% do artefato."},{"name":"prevcarga_resolve_version","module":"registry","signature":"prevcarga_resolve_version(model, area, variant=NULL, {latest|version|pin})","note":"Loader/resolve único sobre <model>/[<variant>/]<area>/{latest,v_*}; substitui os 5 .resolve_*/load_artifact ad-hoc. Variante/EXOGENA entra na chave p/ dessem."},{"name":"prevcarga_registry_promote","module":"registry","signature":"prevcarga_registry_promote(model, area, version, variant=NULL)","note":"Promote ATÔMICO = writeLines em tempfile + file.rename no mesmo FS (fecha o latest-sem-lock do oráculo). Carrega variant (dessem variant-escopado)."},{"name":"prevcarga_registry_gc","module":"registry","signature":"prevcarga_registry_gc(...)","note":"Poda v_* não-apontadas por latest e não-pinadas. LOCAL-ONLY (nunca fala S3, ADR-0016). rollback reescreve latest p/ v_<hash> anterior; pin protege do gc (.pin ao lado de latest)."},{"name":"prevcarga_train_origin","module":"dates","note":"[M2; M5 EDITA o ramo retrain_harness pós-superseder] daily (RF/LGBM) = as_of−1−horizon_days (lê run.yaml via model_spec); retrain_harness (dessem/HW) = série ≤O−1 + manhã ≤available_until, nunca jl_train_origin. Consome o spec EFETIVO (--horizon override)."},{"name":"prevcarga_model_spec","module":"topology","signature":"prevcarga_model_spec(model, root, overrides=)","note":"[M1.2; M5 adiciona overrides=] resolve o spec EFETIVO (run.yaml ⊕ overrides CLI --horizon/--exogena), consumido pelo corte e pelo version_hash. Cresce o contrato M1."}],"functionality":["FE-fachada: assinatura canônica prevcarga_build_features + 5 adapters finos (RF validador-WIDE / LGBM preserva split interno / dessem no-op-com-contrato / HW frames+tokens-estruturais), thin-dispatch com ZERO lógica de FE compartilhada (ADR-0009)","Registry de contrato Tier-A contract-verified wire-time (requires⊆provides nos 4 saltos, fail-loud com lista de gaps) + guard de coluna em runtime; elimina o Tier-B lazy do HW/dessem (ADR-0010)","Transforms de alinhamento to_model_frame/to_display_frame output-preserving, deslocando por −granularity_min do frame operante (ADR-0019), preservando o A/B Δ=0 do dessem","training-fachada + verbo train-models: treina 1 modelo×área (capacidade nova, subset DESBLOQUEADO removendo _require_sin_scope, default=todos), corte honesto POR MODELO via M2, --dry-run/--jobs/--force","Version content-addressed v_<hash> + run-manifest com model_id (fecha version=timestamp não-idempotente); 2 treinos idênticos → mesmo id; trained_at fora do hash","inference-fachada + verbo infer-model: params 100% do artefato (gramática docopt NÃO declara --horizon/--exogena), resolução latest/version/pin, --variant seletor-de-resolução obrigatório p/ dessem, nunca re-fit/re-normaliza","Registry lifecycle + verbo registry (ls/show/promote-atômico/rollback/pin/gc): promote via tempfile+rename, gc local-only preserva latest+pinadas, layout content-addressed com dimensão variant/EXOGENA na chave","Gates por-modelo: portar sub-gates [M5] model-native dos 5 run_all_gates.R (A/B determinístico ADR-0017 |Δ|≤1e-5 mesmo-hardware) + braço MORNING [pós-superseder] + corte-por-protocolo falsificável + SPIKE de avaliação alinhamento LGBM/RF (interval_to_day) destilado no ESTADO-ATUAL"],"verbs":[{"name":"train-models","note":"NOVO: [--model=<lista|todos>] [--area/--subsistema/--areas] [--as-of] [--horizon] [--exogena] [--dry-run] [--jobs] [--force] [--format]. Treina 1 modelo×área, corte honesto por-modelo, subset desbloqueado. --horizon/--exogena declarados (override de default run.yaml). NÃO reproduz o _reduce('train')/freeze da combina."},{"name":"infer-model","note":"NOVO: --model --area [--variant] [--as-of] [--artifact-version|--pin] [--format]. 1 modelo×1 área×1 origem. NÃO declara flags de param (--horizon/--exogena) — params do artefato. --variant = seletor-de-resolução (obrigatório p/ dessem). read-only do registry."},{"name":"registry","note":"NOVO: (ls|show|promote|rollback|pin|gc) [args] [--format]. Ciclo de vida do store; --area pelo mesmo resolvedor fonte-única →exit 4. ls/show read-only; promote/rollback/pin/gc mutam."},{"name":"treinar","note":"EDITAR: alias → train-models com aviso de depreciação em stderr (direciona a train-models + combine, pois o treinar monolítico congelava a combina/k̂)."}]},"M6":{"id":"M6","title":"M6 — Forecast/Export/Reporting full-R + build_long_output + standalones de composição","intent":"Completa o caminho diário em R por ACREÇÃO: nomeia o montador do painel LONG 8-col, torna a reconciliação um módulo com topologia fonte-única, cria o relatório humano HTML+PDF, e colapsa a sequência diária (infer→painel→combine-apply→reconcile→export, default só dados) no verbo forecast + standalones isoláveis. O Python do oráculo deixa de existir no caminho _deliver.","status":"VERIFY-READY (M6): ready:true, 6/6 reviewers unânime, 0 blockers, convergido em 5 rounds (R1-R5, 2026-10-15). Pronto pra implement (CHECKPOINTS['M6'] a wirar). Decisões do Gabriel pendentes antes do implement (freshness-clima instante-vs-midnight é a decisão-chave, bloqueia só o alvo clima-previsto 2b). Pré-reqs M1-M5 ausentes/stub (dívida a resgatar, não escopo do M6).","docPath":"docs/roadmap/M6-FORECAST.md","files":[{"path":"scripts/lib/build_long_output.R","action":"CRIAR","note":"Montador único do painel LONG 8-col model-native de folha: junção honesta de y_true por instante-30min naive-BRT (anti-day-shift/anti-leak), load_mwh fail-high, re-ancoragem em O com trava |Δ|≤0.5s, ramo origin_cut, validador anti-off-by-one. ADR-0002. Writer fino da reconcilia é isento."},{"path":"scripts/lib/forecast.R","action":"CRIAR","note":"Orquestrador do verbo forecast + camada LONG do M6 (chama prevcarga_build_long por-membro na saída model-native do infer, first_forecast_day/origin_cut lido do spec). Produtor do recorte-por-origem (materializa dirs datados, substitui run_reduce.sh:256-277). Reach-control unificado lendo prevcarga_topology(). NÃO edita o infer/M5.3."},{"path":"scripts/lib/exports.R","action":"CRIAR","note":"Módulo 7: extrai o _deliver em R-base/arrow, zero Python. Layout plano por nível + manifest.json {path,nivel,area,linhas,sha256} por byte-copy (nunca re-serializa). Níveis-teto sobre agregados. Nunca fala S3 (ADR-0016)."},{"path":"scripts/lib/reconcile.R","action":"CRIAR","note":"Módulo 6: porta reconcilia_baseline.R com topologia de topology.R (não hardcoded, ADR-0001). k̂ honesto calculado janela <O (não constante, não clamp). SIN=Σsubsistemas count-agnóstico. Writer 8-col fino próprio (forecast_origin character). Perfil content-addressed/promote atômico sobre registry.R/M5.4. WINDOW_DAYS vira parâmetro explícito."},{"path":"scripts/lib/reporting.R","action":"CRIAR","note":"Módulo 10: motor R humano HTML+PDF (primitivas de render HTML/SVG por string, sem Plotly; proveniência/corte em destaque) + forecast --report DIAGNÓSTICO (curva/corte/pesos/vs-persistência, NUNCA acurácia). Conteúdo de acurácia do report_A→M7."},{"path":"scripts/prevcarga","action":"EDITAR","note":"Gramática docopt: verbo forecast + alias prever→forecast (depreciação) + standalones export/reconcile/features (combine já é do M4)."},{"path":"scripts/lib/honesty_gate.R","action":"ESTENDER","note":"Reach-control generalizado p/ módulos-sem-y_true (perturba ENTRADA, exige Δ≠0 na SAÍDA, molde MORNING). 2 alvos: (2a) k̂/reconcile roda no M6 (ratificação-independente); (2b) clima-previsto pós-ratificação. export/combina-apply NÃO entram (erro-de-categoria)."},{"path":"models/<m>/tests/run_all_gates.R","action":"ATIVAR","note":"Ativa os sub-gates [M6] diferidos do M5 (schema_long/ytrue_real/no_dayshift/nowcast-origin_cut) nos 5 plugins; padroniza o critério ytrue_real forte. Exclui harness_*+RF gate08 (M7) e LGBM in-process (era M5)."},{"path":".claude/workflows/implement-milestone.js","action":"EDITAR","note":"CHECKPOINTS['M6']/'M6-FORECAST' → _M6_CP (deployByDefault:false; reprodução in-process no fullGates, abReference cross-machine vazio=M8). A adicionar pré-implement."}],"functions":[{"name":"prevcarga_build_long","module":"build_long_output","signature":"prevcarga_build_long(y_pred, forecast_origin, area, data_dir, granularity_min=30L, first_forecast_day=NULL, origin_cut=NULL)","note":"Dono único do painel: normaliza y_pred (reshape byrow=TRUE d_plus-major), re-ancora em O, junta y_true honesto por ts_r30 (merge all.x, NA onde falta), valida anti-off-by-one, select final das 8 colunas na ordem exata. first_forecast_day passado pelo caller (config-driven)."},{"name":"prevcarga_export","module":"exports","signature":"prevcarga_export(painel, saida, origem, cut, out_ss, leaves, stray, niveis, incluir_membros)","note":"Achata a árvore num layout plano por cópia-de-bytes (file.copy/writeBin, jamais arrow::write_parquet de df relido); manifest 5-campos via provenance.R; --niveis teto só sobre agregados; nada a entregar→stop."},{"name":"prevcarga_reconcile","module":"reconcile","signature":"prevcarga_reconcile(ss, prof_frozen=NULL, need_truth=FALSE, window_days=…)","note":"Porta reconcile_one; need_truth=FALSE = produção sem y_true. Topologia de prevcarga_topology(); k=mean(ratio) na janela (O−window,O−1] (data<O); BU_pred*k; SIN=Σsubsistemas count-agnóstico; registry latest-auto/promote atômico."},{"name":"prevcarga_forecast","module":"forecast","signature":"prevcarga_forecast(spec, as_of, niveis, …)","note":"Orquestra infer(model-native/M5 congelado)→camada LONG→combine-apply(pesos congelados)→reconcile(k̂ congelado)→recorte-por-origem(materializa dirs datados)→export. Apply-nunca-fit. validate-deck gate-0 encadeado; corte do manifesto (não flag). Reach-control unificado de prevcarga_topology()."},{"name":"prevcarga_report","module":"reporting","signature":"prevcarga_report(long, weights, cut, provenance, format=c('html','pdf'))","note":"Motor R HTML+PDF, proveniência/corte em destaque. forecast --report diagnóstico (curva/corte/pesos-da-combina/vs-persistência), SEM y_true. Cadeia R→PDF é decisão do dono (ADR-0017)."}],"functionality":["Painel LONG 8-col ganha um montador nomeado (build_long_output.R): junção honesta de y_true por instante-30min naive-BRT anti-day-shift/anti-leak, load_mwh fail-high, re-ancoragem em O com trava |Δ|≤0.5s, ramo origin_cut, validador embutido","export R-only (byte-copy, nunca re-serializa) + manifest {path,nivel,area,linhas,sha256} com gerado_em como único não-determinismo; --niveis teto sobre agregados, folha-solta sempre; nunca fala S3","reconcile como módulo: topologia fonte-única (não hardcoded), k̂ honesto calculado janela <O (não clamp), SIN=Σsubsistemas count-agnóstico, promote atômico content-addressed, WINDOW_DAYS parâmetro explícito","verbo forecast orquestra o caminho diário em R (infer→painel→combine-apply→reconcile→export, apply-nunca-fit, default só dados), colapsa o reach-control partido em 3 num mecanismo só lendo prevcarga_topology()","reporting HTML+PDF humano nasce; forecast --report é diagnóstico (curva/corte/pesos/vs-persistência), NUNCA acurácia (não há y_true no futuro); distinto de score/backtest --report","standalones export/reconcile/features deixam cada módulo isolável; alias prever→forecast depreciado; ancoragem por-modelo config-driven (lgbm d_plus=0 / RF-HW d_plus≥1)","ativa os sub-gates [M6] diferidos do M5 (schema_long/ytrue_real-forte/no_dayshift/nowcast-origin_cut) nos 5 run_all_gates.R; padroniza ytrue_real no critério forte","reach-control generalizado p/ módulos-sem-y_true (perturba entrada, exige Δ≠0 na saída, molde MORNING): (2a) k̂/reconcile roda no M6; (2b) clima-previsto diferido pós-ratificação freshness-clima"],"verbs":[{"name":"forecast","note":"NOVO. Ponto R único: orquestra infer→painel(camada LONG)→combine-apply→reconcile→export; default só dados (--niveis subsistemas); flags --niveis{sin,subsistemas,tudo}/--report/--report-format{html,pdf}/--skip-validate/--incluir-membros"},{"name":"prever","note":"EDITA. Vira alias→forecast com aviso de depreciação em stderr (ACREÇÃO, Python oráculo é só baseline do A/B)"},{"name":"export","note":"NOVO standalone. Extrai o _deliver: byte-copy + manifest, invocável fora do forecast"},{"name":"reconcile","note":"NOVO standalone. k̂ honesto, topologia fonte-única, SIN=Σsubsistemas; --mode train/apply, --eval"},{"name":"features","note":"NOVO standalone (wiring 100% novo, sem precedente no oráculo). Materializa feature_table via a FE-fachada do M5 (passthrough fino, não recomputa FE)"}]},"M7":{"id":"M7","title":"M7 — Orquestração + cache content-addressed + `backtest` unificado","intent":"M7 entrega o maior volume (o fan-out backtest de membros×áreas×origens) e o cache content-addressed — onde a honestidade é mais tentada a furar por custo, por isso vem por último, gateado por M2 (corte honesto) + honesty-gate (M3). Três peças sobre o caminho forecast/M6: orchestrate.R (matriz membro×folha×origem + ledger local), cache.R (fingerprint que INCLUI o corte) e o verbo backtest unificado (treino→infer-pra-trás→combina→reconcile→avaliação dia-a-dia).","status":"VERIFY-READY","docPath":"docs/roadmap/M7-ORQUESTRACAO.md","files":[{"path":"scripts/lib/orchestrate.R","action":"CRIAR","note":"Matriz membro×folha×origem count-agnóstica; ledger LOCAL (presença de artefato content-addressed, nunca aws s3 ls); plan/--dry-run/--jobs/--resume/--keep-going; resumo duro + exit≠0 em entrega parcial. Substitui backtest.sh+submit*.sh (bash/AWS)."},{"path":"scripts/lib/cache.R","action":"CRIAR","note":"Cache content-addressed chaveado pelo fingerprint de provenance.R/M1 que INCLUI o corte available_until (class-aware); lookup/store LOCAL; honra origem−1−horizonte. Fecha o version=timestamp+latest-sem-corte do oráculo."},{"path":"scripts/lib/backtest.R","action":"CRIAR","note":"Motor do verbo backtest: porta o laço de walk_forward.R + composição combine-apply/reconcile/avaliação num ponto R único; G5 preservado (chama prevcarga_infer/M5, nunca re-implementa inferência). Compõe o caminho do forecast/M6 pra-trás, dia-a-dia."},{"path":"scripts/lib/reporting.R","action":"ESTENDER","note":"M6: conteúdo de ACURÁCIA do backtest --report (WMAPE/horizonte/peak-fixo, port do report_A provido por evaluation.R, renderizado pelas primitivas do M6) + skill-score vs baseline. Só o CONTEÚDO; o cálculo é evaluation.R, nunca reporting.R."},{"path":"scripts/lib/evaluation.R","action":"ESTENDER","note":"ESTENDER SÓ SE o dono optar por (a)/§Decisões D1: portar a régua-de-FORMA (regimes.py + regime×d_plus/rampa/timing/peak-regime). Default (b): NÃO editar no M7. Ato do dono."},{"path":"scripts/prevcarga","action":"EDITAR","note":"Gramática docopt: verbo backtest (--from/--to|--last, --model/--area, --corte, --dplus, --baseline persistencia, --report, --report-format {html,pdf}, --resume) + verbo plan/--dry-run + --jobs/--keep-going. RE-ESCOPAR o gate forecast --corte-ausente do M6 ao bloco do verbo forecast (não à gramática inteira)."},{"path":"models/random-forest/tests/run_all_gates.R","action":"ATIVAR","note":"Ativar os 2 gates de harness [M7] (gate08_ytrue_real, gate12_harness_long) que leem o HP + RE-APONTAR o produtor do HP (walk_forward.R→backtest.R/M7.3)."},{"path":"models/holt-winters/tests/run_all_gates.R","action":"ATIVAR","note":"Ativar o gate de harness [M7] gate10_harness_parity (lê o HP) + RE-APONTAR produtor do HP p/ backtest.R + mapear o lado-unit (run_walk_unit.R → forecast/M6 single-origin COM refit, HW é retrain_harness, não infer-model/M5 congelado)."},{"path":".claude/workflows/implement-milestone.js","action":"EDITAR","note":"CHECKPOINTS['M7']/'M7-ORQUESTRACAO' → _M7_CP (deployByDefault:false; reprodução in-process ≤1e-5 + --resume no fullGates; abReference cross-machine ≤0,1 MW vazio = M8). A adicionar pré-implement."}],"functions":[{"name":"prevcarga_orchestrate","module":"orchestrate","signature":"prevcarga_orchestrate(spec, ...)","note":"Materializa a matriz membro×folha×origem (de prevcarga_topology()/prevcarga_members()), ledger LOCAL done|pending|failed por (membro,folha,origem), --jobs/--resume/--keep-going; default FAIL-FAST, --keep-going materializa parcial + exit≠0."},{"name":"prevcarga_plan","module":"orchestrate","signature":"prevcarga_plan(...)","note":"plan/--dry-run: imprime a matriz + custo estimado ANTES de disparar; NÃO materializa artefato nem roda infer."},{"name":"prevcarga_cache_key","module":"cache","signature":"prevcarga_cache_key(inputs)","note":"Fingerprint de identidade (ADR-0011) = hash({data_fingerprint, cutoff/available_until, feature_config, member_label=(mdir,exogena), model_versions, code_commit, renv_lock_hash, seed}); class-aware — corte na chave p/ data/feature-table + artefato cut-variante (protocol==retrain_harness E cut_invariant==false); platform/BLAS/TZ/LC/bundle_id/trained_at FORA do hash."},{"name":"prevcarga_cache_get","module":"cache","note":"Lookup LOCAL (nunca S3); hit → reusa artefato content-addressed byte-idêntico via freeze/registry M5; verifica o corte (não auto-detecta)."},{"name":"prevcarga_cache_put","module":"cache","note":"Miss → computa, congela saveRDS content-addressed v_<hash> (NÃO v_timestamp), armazena LOCAL."},{"name":"prevcarga_backtest","module":"backtest","signature":"prevcarga_backtest(from, to|last, model, area, corte, dplus, baseline, ...)","note":"Por origem O pra-trás: treino-ou-infer (config-driven do protocol) → camada LONG (build_long_output/M6) → combina-full HONESTA por-mês (combina_full/M4, target<início(m), leak-fix #1, fita NÃO aplica congelado) → reconcile (k̂) → avaliação dia-a-dia (evaluation.R/M3). G5 preservado; retrain NÃO promove o latest de produção; --corte varre o intradiário; default só dados."}],"functionality":["Orquestrador R da matriz membro×folha×origem (8 membros via prevcarga_members(), não 5 modelos) com ledger LOCAL (nunca S3, ADR-0016), progresso 47/192 count-agnóstico, plan/--dry-run/--jobs/--resume/--keep-going, resumo duro + exit≠0 em entrega parcial (SIN nunca fabricado com cobertura incompleta).","Cache content-addressed cujo fingerprint INCLUI o corte available_until (class-aware): o invariante #1 — um cache-hit NUNCA serve resultado computado com dado mais fresco que origem−1−horizonte permitia (dois cortes intradiários → chaves DIFERENTES).","Verbo backtest unificado colapsa num ponto R único o que vive em 6+ peças de shell: treino→infer-pra-trás→combina-full honesta por-mês→reconcile→avaliação dia-a-dia sobre os 8 membros (G5 preservado: nunca infere, chama prevcarga_infer/M5).","Retrain por-origem do backtest escreve só no cache/M7.2 e NUNCA promove o latest do registry de produção (reasere o isolamento que o OUT_DIR-por-RUN do oráculo dava de graça).","backtest --report = ACURÁCIA (WMAPE por horizonte, peak-WMAPE-fixo-18-22h + viés-de-pico, skill) renderizada pelas primitivas do reporting.R/M6 em HTML+PDF, calculada pela fonte-única evaluation.R/M3.","Skill-score vs baseline (persistência O−1 + sazonal-ingênuo O−7) — a régua que o oráculo não tem — + pontuação fresca em nível-SIN (diferida do M3, SIN=Σsubsistemas count-agnóstico).","Ativa os 3 gates de harness diferidos que leem o HP (RF gate08_ytrue_real/gate12_harness_long, HW gate10_harness_parity) re-apontando o produtor do HP de walk_forward.R para backtest.R.","Substitui backtest.sh+submit*.sh (bash/AWS Batch) e o version=v_<Sys.time()>+latest-sem-corte do oráculo por R-only content-addressed; é a 1ª régua honesta de re-baselina do DESSEM."],"verbs":[{"name":"backtest","note":"NOVO — 1º verbo R unificado da varredura: orquestra treino→infer-pra-trás→combina→reconcile→avaliação dia-a-dia; flags --from/--to|--last, --model/--area, --corte, --dplus, --baseline persistencia, --report, --report-format {html,pdf}, --resume. Não existe no oráculo (capacidade nova, não port)."},{"name":"plan","note":"NOVO — plan/--dry-run: materializa a matriz membro×folha×origem + custo estimado ANTES de disparar; não computa nada. Não existe no oráculo."}]},"M8":{"id":"M8","title":"M8 — Runtime R-only (S3) + install bootstrap + `verificar` + `morning` + A/B completo (gate de corte) + remoção final do Python","intent":"Transforma o clean-room em produto distribuível e decide o corte: (1) runtime R-only construído por CI e publicado no S3 (S3 só nas pontas, ADR-0016); (2) instaladores install/install.sh (jammy) e install/install.ps1 (Windows→WSL2) com hash obrigatório, instalação versionada, raiz de estado separada (PREVCARGA_STATE) e canal dos artefatos treinados; (3) verbos `verificar` (sha256 + trilhos ADR-0017) e `morning` (runbook diário); (4) A/B completo por estágio contra prevcargadessem3 = gate de corte, mais remoção final do Python provada sobre o artefato e write-through de encerramento.","status":"VERIFY-READY (M8) — verify-milestone R22 (2026-10-16): ready:true · 0 blockers · consenso 6/6 (22 rounds); 22 materiais residuais NÃO aplicados. Último milestone do programa (M1…M8). Checkpoint TERMINAL: 1º _M<n>_CP com abReference populado, deployByDefault:false.","docPath":"docs/roadmap/M8-BUNDLE.md","files":[{"path":"ci/build_runtime.sh","action":"CRIAR","note":"M8.1: porta ci/build_marmita.sh sem uv/venv/python3/ARROW_S3; container ubuntu:22.04 pinado + snapshot apt; gera runtime/{R,rlib,syslib} + code/ + RUNTIME.json + tarball .tar.zst + .sha256"},{"path":"ci/publish_runtime.sh","action":"CRIAR","note":"M8.2: aws s3 cp p/ s3://<bucket>/<prefixo>/runtime/v<VER>/ (imutável), --promote escreve LATEST, --artefatos publica pacote de artefatos, --canary; exige recibos de gate do sha exato. Único arquivo do repo com aws s3; fora do code/"},{"path":"install/install.sh","action":"CRIAR","note":"M8.3: preflight (musl/glibc≥2.35/x86_64 → exit 6), download+hash obrigatório, extração atômica em versions/<VER>/ + current symlink, retenção N=2, --rollback/--uninstall/--purge, relocação R + shim Rscript, gera launcher bin/prevcarga, --artefatos → registry import"},{"path":"install/install.ps1","action":"CRIAR","note":"M8.4: Windows→WSL2 (wsl --status; -InstallDistro; roda install.sh dentro da distro Ubuntu-22.04; -Runtime/-Sha256 local; -Artefatos repetido); instala %LOCALAPPDATA%\\prevcarga\\prevcarga.cmd com WSLENV"},{"path":"install/run_ab_wsl.ps1","action":"CRIAR","note":"M8.4 Step 4b: perna WSL2 do A/B — copia ref/A/ + manifest de congelamento + deck + checkout e roda test_ab_corte.sh --so-estagio-A --plataforma wsl2-frota; grava recibo ab_A.wsl2-frota.json"},{"path":"install/tests/","action":"CRIAR","note":"Pester + PSScriptAnalyzer do install.ps1 (container mcr.microsoft.com/powershell:7.4-ubuntu-22.04)"},{"path":"scripts/lib/verify_repro.R","action":"CRIAR","note":"M8.5: prevcarga_verify_repro — integridade sha256 → identidade (run_manifest) → pareamento nativo/legado → valores por trilho; localizador novo só p/ reconc + varredura de extras (membros via prevcarga_combina_discover do M4)"},{"path":"scripts/lib/morning.R","action":"CRIAR","note":"M8.6: prevcarga_morning — status→validate-deck (gate-0)→score de ontem→re-fit retrain_harness (cache put + pins)→forecast --pins→report; nunca promove; resumo.json persistido"},{"path":"scripts/lib/runtime.R","action":"ESTENDER","note":"M1 → M8: prevcarga_platform_check() p/ o doctor; prevcarga_state_root() (PREVCARGA_STATE, default dev <repo>/.state/); prevcarga_data_root() (PREVCARGA_DATA, sem default em code/, D22)"},{"path":"scripts/lib/provenance.R","action":"ESTENDER","note":"M1.3 → M8: run-manifest ganha runtime_id lateral (fora do hash; null na dev) + config_hash lateral; prevcarga_code_commit() path-scoped (git log -1 sobre o conjunto do code/; no instalado lê do RUNTIME.json); b (function(){
'use strict';
var VM = JSON.parse(document.getElementById('data').textContent);

var MSN = {}; VM.milestones.forEach(function(m){ MSN[m.id] = m; });
var KCOL = { module:'var(--c-mod)', verb:'var(--c-verb)', transversal:'var(--c-trans)', config:'var(--c-cfg)', tool:'var(--c-cfg)' };
var KNAME = { module:'módulo de pipeline', verb:'verbo CLI', transversal:'transversal', config:'config / gates', tool:'ferramenta (scripts/tools/, fora do runtime)' };
var BAND = {}, NODES = {}, cards = {};
var state = { sel:'ALL', mode:'delta', emode:'focus', tab:'map', pin:null, hover:null, q:'', g:'pack', fn:true };
var touchedBy = {}; ORDER.forEach(function(m){ touchedBy[m] = {}; ((VM.deltas[m]||{}).verbs||[]).forEach(function(v){ touchedBy[m][v.name] = true; }); });
var isCode = function(p){ return /^(scripts\/|models\/|config\/|tests\/)/.test(p); };
var isCond = function(f){ return /s[oó] se|condicional/i.test(f.note||''); };

// ---------- helpers ----------
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function rich(node, text){ String(text==null?'':text).split('`').forEach(function(p,i){ if (!p) return; if (i%2===1){ var c = document.createElement('code'); c.textContent = p; node.appendChild(c); } else node.appendChild(document.createTextNode(p)); }); return node; }
function sw(color){ var s = el('span','sw'); s.style.background = color; return s; }
function msOf(id){ return NODES[id] ? NODES[id].ms : ''; }
function readHash(){ var h = location.hash.replace(/^#/,''); if (!h) return; h.split('&').forEach(function(kv){ var p = kv.split('='); var k = decodeURIComponent(p[0]||''), v = decodeURIComponent(p[1]||''); if (k==='m' && (v==='ALL'||ORDER.indexOf(v)>=0)) state.sel = v; if (k==='mode' && (v==='delta'||v==='acc')) state.mode = v; if (k==='edges' && /^(focus|all|none)$/.test(v)) state.emode = v; if (k==='tab' && /^(map|graph|matrix|table)$/.test(v)) state.tab = v; if (k==='g' && /^(pack|layers|free)$/.test(v)) state.g = v; if (k==='fn' && /^(0|1)$/.test(v)) state.fn = v==='1'; if (k==='pin') state.pin = v; if (k==='theme' && /^(light|dark)$/.test(v)) document.documentElement.setAttribute('data-theme', v); }); }
function writeHash(){ var parts = ['m='+state.sel,'mode='+state.mode,'edges='+state.emode,'tab='+state.tab]; if (state.tab==='graph'){ parts.push('g='+state.g); parts.push('fn='+(state.fn?'1':'0')); } if (state.pin) parts.push('pin='+encodeURIComponent(state.pin)); var t = document.documentElement.getAttribute('data-theme'); if (t) parts.push('theme='+t); history.replaceState(null,'','#'+parts.join('&')); }
function inDelta(n, m){ if (n.planned) return false; if (n.kind==='config') return n.touches.some(function(t){ return t.m===m; }); return n.ms===m; }
function isTouched(n, m){ return n.kind==='verb' && !n.planned && n.ms!==m && !!touchedBy[m] && !!touchedBy[m][n.label]; }

// ---------- cards ----------

function setOpen(c, on){ c.classList.toggle('open', on); var mo = c.querySelector('.more'); if (mo) mo.textContent = on ? 'menos' : '+'+mo.dataset.n; }
function mkCard(n, kind){
