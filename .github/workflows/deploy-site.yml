# Publica o site de documentacao (website/, Docusaurus) no GitHub Pages a cada push na main que toque website/.
# Fonte do Pages: "GitHub Actions" (Settings > Pages > Build and deployment > Source), nao "Deploy from a branch".
name: deploy-site

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o check-sources compara commit_base..HEAD
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check
      - run: npx docusaurus build
        env:
          PC_SITE_URL: ${{ steps.pages.outputs.origin }}
          PC_SITE_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
