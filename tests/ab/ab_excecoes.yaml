# LISTA FECHADA de excecoes conscientes ao Delta = 0 do A/B do corte (ADR-0034 D23). DONO: Gabriel -- so ele acrescenta itens.
# Cada item cita a DECISAO e o doc de origem. Nenhuma divergencia nova entra aqui por conta de quem implementa: uma divergencia fora desta lista
# da FAIL na celula (ver docs/estado/ab.md). Semeada (M8.8) SO com decisoes ja tomadas e registradas em docs/estado:
#   regdin (ADR-0036), dessem-linear hora incompleta no clima previsto, dessem-linear sp-2024-11-15 (DL9-GAP-2).
# Campos: id, membro, estagio, condicao (expressao sobre os campos do caso), justificativa, adr (obrigatorios); opcionais: limite {max_abs,
# max_rel} (max_rel = max|D| / max|ref|), janela_final_h (a excecao so cobre as ultimas N horas da faixa do membro), decisao, fonte.
excecoes:
  - id: regdin.versao_pacotes
    membro: dessem-regdin
    estagio: A
    condicao: "mdir == 'dessem-regdin'"
    justificativa: "R 4.5.3 + renv.lock novo (WeightSVM 1.7-11 -> 1.7-16, e1071 1.7-13 -> 1.7-17, fable 0.3.3 -> 0.5.0): o regdin pode divergir do oraculo ate max_rel 1,3e-5; RF, LGBM e HW seguem em Delta = 0"
    adr: "ADR-0036"
    limite: {max_rel: 1.3e-5}
    decisao: "Gabriel (relay do orquestrador), spike M1.7"
    fonte: "docs/estado/m1-spike-r453.md (Decisao)"
  - id: dessem_linear.hora_incompleta_clima_previsto
    membro: dessem-linear
    estagio: A
    condicao: "mdir == 'dessem-linear'"
    justificativa: "hora incompleta descartada tambem na previsao de clima (o oraculo faz a media dos slots existentes); so as ultimas ~3 h do ultimo dia entregue (O+8) divergem, Delta = 0 no resto de O..O+8"
    adr: "ADR-0035"
    janela_final_h: 3
    decisao: "Gabriel 2026-10-30 (divergencia deliberada)"
    fonte: "docs/estado/dessem_linear.md (divergencia deliberada, texto proposto para ab_excecoes.yaml)"
  - id: dessem_linear.sp_2024_11_15_residuo_numerico
    membro: dessem-linear
    estagio: A
    condicao: "area == 'SP' && origem == as.Date('2024-11-15')"
    justificativa: "residuo numerico documentado (DL9-GAP-2): max_abs medido 0,446 MW (teto 0,5), max_rel medido 3e-5 (teto 5e-5); causa: 1 ulp em mm (media de slots x media de medias horarias) amplificado pelo SVM da DM(O) de feriado; demais unidades Delta = 0"
    adr: "ADR-0035"
    limite: {max_abs: 0.5, max_rel: 5.0e-5}
    decisao: "Gabriel (DL9-GAP-2; registrada em 2026-10-30 em dessem_linear.md, reconfirmada na dispatch do M8.8 em 2026-10-31)"
    fonte: "docs/estado/dessem_linear.md (EXCECAO NUMERICA DOCUMENTADA, DL9-GAP-2)"
